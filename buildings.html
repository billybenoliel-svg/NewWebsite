<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buildings | Araya.ca</title>
  <meta
    name="description"
    content="Browse Araya.ca apartment buildings across Ontario."
  />
  <link rel="stylesheet" href="styles.css" />
</head>

<body data-page="buildings">
  <div class="topbar">
    Choose a city, view buildings, and open a full detail page for each property.
  </div>

  <header id="siteHeader"></header>

  <main>
    <section class="page-hero">
      <p class="eyebrow">Buildings</p>
      <h1>Featured rental properties.</h1>
      <p>
        Browse buildings by city. Each property has a full details page with
        suite types, rates, amenities, and leasing actions.
      </p>
    </section>

    <section class="section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Browse listings</p>
          <h2>Choose a city.</h2>
        </div>

        <a
          class="button light"
          href="https://www.familyproperties.ca/"
          target="_blank"
          rel="noreferrer"
        >
          Original site
        </a>
      </div>

      <div class="filters">
        <button class="filter active" type="button" data-filter="all">All</button>
        <button class="filter" type="button" data-filter="toronto">Toronto</button>
        <button class="filter" type="button" data-filter="hamilton">Hamilton</button>
        <button class="filter" type="button" data-filter="oshawa">Oshawa</button>
        <button class="filter" type="button" data-filter="penetanguishene">Penetanguishene</button>
        <button class="filter" type="button" data-filter="sault-ste-marie">Sault Ste. Marie</button>
      </div>

      <div class="buildings-grid" id="buildingGrid"></div>
    </section>
  </main>

  <footer id="siteFooter"></footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
